/* ---------- layout ---------- */
main{max-width:1440px;margin:0 auto;padding:20px 24px 60px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:2px 9px 2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap;color:var(--text)}
.ico{font-size:10px;line-height:1;display:inline-block;width:10px;text-align:center}

.bg-onTrack{background:var(--good)} .bg-atRisk{background:var(--warning)} .bg-delayed{background:var(--critical)} .bg-completed{background:var(--done)} .bg-onHold{background:var(--neutral)}.bg-closed{background:var(--closed)}.c-closed{color:var(--closed)}

/* horizontal bars */

/* scatter */
svg text{font-family:inherit}
.scatter{width:100%;height:auto;display:block}
.dot{cursor:pointer}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--border)}

.table-wrap{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--border)}

.g-label{padding:8px 10px 8px 0;border-bottom:1px solid var(--border);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
:root[dir="rtl"] .g-label{padding:8px 0 8px 10px}
.g-label:hover{color:var(--s1)}
.g-track{position:relative;border-bottom:1px solid var(--border);height:38px}
.g-bar{position:absolute;top:11px;height:16px;border-radius:4px;background:var(--track);overflow:hidden;cursor:pointer}

  if(S.mode==="demo"){const arr=S[coll],i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]={...obj};else arr.push({...obj});scheduleRender();return}
  try{await db.collection(coll).doc(obj.id).set(clean(obj))}
  catch(e){handleWriteErr(e);throw e}
}
async function delDoc(coll,id){
  if(LOG_KIND[coll]){const o=(S[coll]||[]).find(x=>x.id===id);if(o)logOther(coll,o,true)}
  if(S.mode==="demo"){S[coll]=S[coll].filter(x=>x.id!==id);scheduleRender();return}
  try{await db.collection(coll).doc(id).delete()}catch(e){handleWriteErr(e);throw e}
}
function handleWriteErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument"&&S.mode==="live"){S.canWrite=false;S.banner={kind:"info",msg:"readOnly"};render()}
  toast(code==="quota_exceeded"?t("quota"):t("saveFailed",{m:(e&&e.message)||code||"error"}));
}
async function runBatch(items,label){ // items: [{coll,obj}|{coll,del}]
  for(let i=0;i<items.length;i++){
    if(items.length>3&&(i%3===0))S.busy=t(label,{i:i+1,n:items.length}),toast(S.busy,true);
    const it=items[i];
    let tries=0;
    for(;;){try{if(it.del)await delDoc(it.coll,it.del);else await putDoc(it.coll,it.obj);break}
      catch(e){if((e&&(e.code==="unavailable"||e.code==="resource_exhausted"))&&tries<3){tries++;await new Promise(r=>setTimeout(r,600*tries+Math.random()*400));continue}throw e}}
  }
  S.busy=null;
}

function squarify(items,x,y,w,h){

  const scale=w*h/total;rest=rest.map(i=>({...i,a:i.v*scale}));
  const worst=(row,len)=>{const s=row.reduce((a,i)=>a+i.a,0),mx=Math.max(...row.map(i=>i.a)),mn=Math.min(...row.map(i=>i.a));return Math.max(len*len*mx/(s*s),s*s/(len*len*mn))};
  while(rest.length){const len=Math.min(w,h);let row=[rest[0]];let i=1;
    while(i<rest.length&&worst([...row,rest[i]],len)<=worst(row,len)){row.push(rest[i]);i++}
    const s=row.reduce((a,r)=>a+r.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(r=>{const rh=r.a/cw;out.push({...r,x,y:cy,w:cw,h:rh});cy+=rh});x+=cw;w-=cw}
    else{const rh=s/w;let cx=x;row.forEach(r=>{const cw=r.a/rh;out.push({...r,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}
    rest=rest.slice(row.length)}
  return out;
}

const prQ={};
function patchAct(a,pr){const o={...a,pr};if(pr>=100){o.st="done";if(!o.ae)o.ae=isoToday()}else{o.st=pr>0?"inProgress":"notStarted";delete o.ae}if(pr>0&&!o.as)o.as=isoToday();return o}
function setActPr(pid,aid,pr){
  pr=clamp(Math.round(+pr||0),0,100);const pl=planOf(pid);if(!pl)return;const cur=pl.acts.find(x=>x.id===aid);if(!cur||+cur.pr===pr)return;
  const q=prQ[pid]||(prQ[pid]={ch:new Map(),t:0,busy:false});if(!q.orig)q.orig=new Map();if(!q.orig.has(aid))q.orig.set(aid,{...cur});q.ch.set(aid,pr);
  S.plans=S.plans.map(x=>x.id===pid?{...x,acts:x.acts.map(a=>a.id===aid?patchAct(a,pr):a)}:x);
  if(pr>=100&&!evOf(pid,aid).length)toast(t("doneHint"));
  scheduleRender();
  clearTimeout(q.t);q.t=setTimeout(()=>flushPr(pid),600);
}
async function flushPr(pid){
  const q=prQ[pid];if(!q||!q.ch.size)return;if(q.busy){clearTimeout(q.t);q.t=setTimeout(()=>flushPr(pid),400);return}
  q.busy=true;const sent=new Map(q.ch);
  const pl=planOf(pid);
  try{if(pl){const acts=pl.acts.map(a=>sent.has(a.id)&&+a.pr!==sent.get(a.id)?patchAct(a,sent.get(a.id)):a);const before=acts.map(a=>q.orig&&q.orig.has(a.id)&&sent.has(a.id)?q.orig.get(a.id):a);await savePlan(pid,acts,before)}
    sent.forEach((v,k)=>{if(q.ch.get(k)===v){q.ch.delete(k);if(q.orig)q.orig.delete(k)}})}
  catch(e){q.ch.clear()}
  finally{q.busy=false;if(q.ch.size){clearTimeout(q.t);q.t=setTimeout(()=>flushPr(pid),400)}}
}

async function dropAssets(list){if(!assetsNS)return;for(const e of list){if(e.assetId){try{await assetsNS.delete(e.assetId)}catch(err){}}}}
async function uploadEvidence(pid,aid,files){
  if(!assetsNS){toast(t("evNoUpload"));return}
  const have=evOf(pid,aid).length;if(have+files.length>MAX_FILES){toast(t("maxFiles",{n:MAX_FILES}),true);files=files.slice(0,Math.max(0,MAX_FILES-have));if(!files.length)return}
  S.uploading.add(aid);renderDrawer(true);let ok=0;
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase();const type=EV_TYPES[ext];
    if(!type){toast(t("evBadType",{f:f.name}),true);continue}
    if(f.size>20*1048576){toast(t("evTooBig",{f:f.name}),true);continue}
    try{let r;try{r=await assetsNS.upload(f,{type})}catch(e){if(e&&e.code==="store_unavailable"){await new Promise(z=>setTimeout(z,1200));r=await assetsNS.upload(f,{type})}else throw e}
      await putDoc("evidence",{id:uid("e"),projectId:pid,actId:aid,name:f.name,assetId:r.id,type:r.contentType||type,size:r.sizeBytes||f.size,by:ME(),at:new Date().toISOString()});ok++}
    catch(e){const c=e&&e.code;toast(c==="unsupported_type"?t("evBadType",{f:f.name}):c==="too_large"?t("evTooBig",{f:f.name}):c==="quota_or_state"?t("quota"):t("saveFailed",{m:(e&&e.message)||c||"error"}),true)}
  }
  S.uploading.delete(aid);if(ok)toast(t("uploaded",{n:num(ok)}));renderDrawer(true);if(!S.drawer)render();
}

}

/* ================= leadership views & monthly report ================= */
const EXEC_GROUPS={sponsor:p=>p.sponsor,dept:p=>p.department,portfolio:p=>p.portfolio,initiative:p=>p.initiative,manager:p=>p.manager};
function grpStats(ps){
  const ms=ps.map(p=>({p,m:metrics(p),s:ST(p),u:updState(p)}));const w=ms.filter(x=>x.m.nActs>0);
  const avg=k=>w.length?w.reduce((a,x)=>a+x.m[k],0)/w.length:0;const c=k=>ms.filter(x=>x.s===k).length;
  const od=ms.reduce((a,x)=>a+actsOf(x.p.id).filter(y=>actState(y)==="overdue").length,0);
  return{n:ms.length,prog:avg("prog"),planned:avg("planned"),budget:ms.reduce((a,x)=>a+(+x.p.budget||0),0),
    onTrack:c("onTrack"),atRisk:c("atRisk"),delayed:c("delayed"),completed:c("completed"),onHold:c("onHold"),closed:c("closed"),od,sub:ms.filter(x=>x.u==="submitted").length,ms}}
function mixBar(g){const tot=g.n||1;const seg=["closed","completed","onTrack","atRisk","delayed","onHold"].filter(k=>g[k]);
  return `<div class="mix" data-tip="${seg.map(k=>esc(t("st_"+k))+": <b>"+num(g[k])+"</b>").join("<br>")}">${seg.map(k=>`<i class="bg-${k}" style="width:${g[k]/tot*100}%"></i>`).join("")}</div>`}
function keyDeliverables(ps,daysAhead){const lim=new Date(TODAY.getTime()+daysAhead*864e5);const out=[];
  for(const p of ps)for(const a of actsOf(p.id)){const s=actState(a);if(s==="done")continue;const e=parseD(a.pe);if(!e||e>lim)continue;
    if(autoPhase(a.wp)!=="launch"&&autoPhase(a.t)!=="launch")continue;out.push({p,a,e,s})}
  const up=out.filter(x=>x.s!=="overdue").sort((x,y)=>x.e-y.e),od=out.filter(x=>x.s==="overdue").sort((x,y)=>y.e-x.e);return [...up,...od]}
function execData(){const ps=fProjects();const g=grpStats(ps);const by=EXEC_GROUPS[S.execBy]?S.execBy:(S.role==="lead"?"initiative":"dept");
  const groups=new Map();for(const p of ps){const k=EXEC_GROUPS[by](p)||"—";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}
  const rows=[...groups.entries()].map(([k,list])=>({k,g:grpStats(list)})).sort((a,b)=>(a.g.prog-a.g.planned)-(b.g.prog-b.g.planned));
  const attn=g.ms.filter(x=>x.s==="delayed"||x.s==="atRisk").sort((a,b)=>a.m.variance-b.m.variance).slice(0,10);
  const kd=keyDeliverables(ps,60);
  return{ps,g,by,rows,attn,kd}}
function vExecOld(){
  const {ps,g,by,rows,attn,kd}=execData();
  resolveNames(ps.map(p=>{const pl=planOf(p.id)||{};return pl.lastUpdate&&pl.lastUpdate.by}).filter(Boolean));
  const basis=t(S.progMode==="weighted"?"pmWeighted":"pmPct");
  const kpi=(lab,val,sub)=>`<div class="card kpi"><div class="kpi-label">${lab}</div><div class="kpi-value num">${val}</div><div class="sub">${sub}</div></div>`;
  const kpis=`<div class="exec-kpis">
    ${kpi(esc(t("progress")),pct(g.prog),esc(t("planned"))+": "+pct(g.planned)+" · "+esc(basis))}
    ${kpi(esc(t("exStatusMix")),num(g.onTrack+g.completed+(g.closed||0))+`<span class="cur"> / ${num(g.n)}</span>`,mixBar(g)+`<div class="psub" style="margin-top:6px">${esc(t("st_atRisk"))}: ${num(g.atRisk)} · ${esc(t("st_delayed"))}: ${num(g.delayed)}</div>`)}
    ${kpi(esc(t("exBudget")),money(g.budget),esc(t("exBudgetSub")))}
    ${kpi(esc(t("exOverdue")),num(g.od),esc(t("exOverdueSub")))}
    ${kpi(esc(t("exUpdates")),num(g.sub)+`<span class="cur"> / ${num(g.n)}</span>`,esc(t("updPeriod",{p:fdate(isoToday(),{month:"long",year:"numeric"})})))}</div>`;
  const open=S.execOpen||"";
  const roll=`<div class="card mt"><div class="card-head"><div><h2>${esc(t("exRollup"))}</h2><div class="sub">${esc(t("exRollupSub"))}</div></div><div class="seg-ctl">${Object.keys(EXEC_GROUPS).map(k=>`<button class="${by===k?"on":""}" data-act="exec-by" data-v="${k}">${esc(t("exBy_"+k))}</button>`).join("")}</div></div>
    <div class="table-wrap"><table><thead><tr><th>${esc(t("exBy_"+by))}</th><th class="r">${esc(t("nav_projects"))}</th><th style="min-width:180px">${esc(t("progress"))}</th><th class="r">${esc(t("variance"))}</th><th style="min-width:120px">${esc(t("status"))}</th><th class="r">${esc(t("exBudget"))}</th><th class="r">${esc(t("exOverdue"))}</th><th class="r">${esc(t("exUpdates"))}</th></tr></thead><tbody>
    ${rows.map(({k,g:x})=>{const isO=open===by+"|"+k;return `<tr class="clickable" data-act="exec-open" data-v="${esc(by+"|"+k)}"><td class="pname"><span class="caret">${isO?"▾":(S.lang==="ar"?"◂":"▸")}</span> ${esc(k==="—"?t(by==="initiative"?"noInit":"noValue"):(tv(k)||k))}</td><td class="r num">${num(x.n)}</td><td>${progBar({prog:x.prog,planned:x.planned})}</td><td class="r">${varChip(x.prog-x.planned)}</td><td>${mixBar(x)}</td><td class="r num">${money(x.budget)}</td><td class="r num">${num(x.od)}</td><td class="r num">${num(x.sub)}/${num(x.n)}</td></tr>
      ${isO?`<tr class="sub-row"><td colspan="8"><div class="table-wrap"><table><tbody>${x.ms.sort((a,b)=>a.m.variance-b.m.variance).map(({p,m,s})=>`<tr class="clickable" data-act="open-project" data-id="${esc(p.id)}"><td class="num psub" style="white-space:nowrap">${esc(p.code)}</td><td style="max-width:360px">${esc(pname(p))}</td><td>${esc(p.manager||"—")}</td><td>${statusChip(s)}</td><td style="min-width:160px">${progBar(m)}</td><td class="r">${varChip(m.variance)}</td><td class="psub" style="white-space:nowrap">${lastUpdTxt(planOf(p.id))}</td></tr>`).join("")}</tbody></table></div></td></tr>`:""}`}).join("")}</tbody></table></div></div>`;
  const att=`<div class="card"><h2>${esc(t("exAttention"))}</h2><div class="sub">${esc(t("exAttentionSub"))}</div>${attn.length?`<div class="list">${attn.map(({p,m,s})=>{const pl=planOf(p.id)||{};const note=pl.submitted&&pl.submitted.note;
    return `<div class="li clickable" style="grid-template-columns:auto 1fr auto" data-act="open-project" data-id="${esc(p.id)}"><span class="pchip num">${esc(p.code)}</span><div style="min-width:0"><div class="t">${esc(pname(p))}</div><div class="s">${esc(p.manager||"—")} · ${esc(tv(p.sponsor)||"—")}</div>${note?`<div class="note">“${esc(clip(note,160))}”</div>`:""}</div><div style="text-align:end">${statusChip(s)}<div class="psub num" style="margin-top:4px">${pct(m.prog)} / ${pct(m.planned)}</div></div></div>`}).join("")}</div>`:`<div class="empty">${esc(t("none"))}</div>`}</div>`;
  const kdl=`<div class="card"><h2>${esc(t("exKeyDel"))}</h2><div class="sub">${esc(t("exKeyDelSub"))}</div>${kd.length?`<div class="list">${kd.slice(0,14).map(({p,a,s})=>`<div class="li clickable" style="grid-template-columns:auto 1fr auto" data-act="open-project" data-id="${esc(p.id)}"><div class="datebox"><b class="num">${fdate(a.pe,{day:"numeric"})}</b><small>${fdate(a.pe,{month:"short"})}</small></div><div style="min-width:0"><div class="t" style="font-weight:400">${esc(a.t)}</div><div class="s">${esc(p.code)} · ${esc(pname(p))}</div></div>${actChip(s)}</div>`).join("")}</div>`:`<div class="empty">${esc(t("none"))}</div>`}</div>`;
  return kpis+execCharts(ps,g,by)+roll+`<div class="grid g2 mt">${att}${kdl}</div>`;
}

function reportHtml(R){
  R=R||rpRange("monthly",0);const {ps,g,attn,kd}=execData();const ar=S.lang==="ar";const per=R.label;
  const basis=t(S.progMode==="weighted"?"pmWeighted":"pmPct");
  const filt=[S.filters.portfolio,S.filters.init,S.filters.dept,S.filters.status&&t("st_"+S.filters.status),S.filters.q].filter(Boolean).map(tv).join(" · ");
  const P=v=>pct(v),C={onTrack:"#129B82",atRisk:"#E0B54F",delayed:"#8A1538",completed:"#4194B3",onHold:"#9a9a9a",closed:"#0D4261"};
  const SK=["closed","completed","onTrack","atRisk","delayed","onHold"];
  const chip=s=>`<span class="st" style="color:${s==="atRisk"?"#9a7614":C[s]}">${STATUS_ICON[s]||"●"} ${esc(t("st_"+s))}</span>`;
  const bar=(a,b)=>`<div class="bar"><b style="width:${Math.max(0,Math.min(100,a))}%"></b><i style="${ar?"right":"left"}:${Math.max(0,Math.min(100,b))}%"></i></div>`;
  /* charts */
  const donut=(segs,center,sub)=>{const R=52,r=34,cx=70,cy=70,tot=segs.reduce((a,x)=>a+x.v,0)||1;let a0=-Math.PI/2,out="";
    for(const x of segs){if(!x.v)continue;const a1=a0+x.v/tot*2*Math.PI,lg=a1-a0>Math.PI?1:0;
      const p=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
      out+=x.v===tot?`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${x.c}" stroke-width="${R-r}"/>`:`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${x.c}"/>`;a0=a1}
    return `<svg viewBox="0 0 140 140" width="132" height="132">${out}<text x="70" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b">${center}</text><text x="70" y="88" text-anchor="middle" font-size="10" fill="#666">${sub}</text></svg>`};

  const gauge=(a,b)=>{const cx=90,cy=86,R=70,w=16,pt=v=>{const an=Math.PI*(1-Math.max(0,Math.min(100,v))/100);return [cx+R*Math.cos(an),cy-R*Math.sin(an)]};
    const arc=(v,col)=>{const [x,y]=pt(v);return v<=0?"":`<path d="M${cx-R} ${cy}A${R} ${R} 0 0 1 ${x} ${y}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="butt"/>`};
    const [tx,ty]=pt(b),an=Math.PI*(1-Math.max(0,Math.min(100,b))/100);
    return `<svg viewBox="0 0 180 104" width="190" height="110" style="direction:ltr">${arc(100,"#ebeae4")}${arc(a,"#0D4261")}<line x1="${cx+(R-w/2-4)*Math.cos(an)}" y1="${cy-(R-w/2-4)*Math.sin(an)}" x2="${cx+(R+w/2+4)*Math.cos(an)}" y2="${cy-(R+w/2+4)*Math.sin(an)}" stroke="#A29475" stroke-width="3"/><text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="24" font-weight="700" fill="#0D4261">${P(a)}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="#666">${esc(t("planned"))} ${P(b)}</text></svg>`};
  const stack=(segs)=>{const tot=segs.reduce((a,x)=>a+x.v,0)||1;return `<div class="stk">${segs.filter(x=>x.v).map(x=>`<i style="width:${x.v/tot*100}%;background:${x.c}" title="${esc(x.l)}"></i>`).join("")}</div>`};
  const groupsOf=key=>{const m=new Map();for(const p of ps){const k=EXEC_GROUPS[key](p)||"—";if(!m.has(k))m.set(k,[]);m.get(k).push(p)}
    return [...m.entries()].map(([k,l])=>({k,g:grpStats(l)})).sort((a,b)=>(a.g.prog-a.g.planned)-(b.g.prog-b.g.planned))};

const CAT=["#0D4261","#A29475","#4194B3","#129B82","#8A1538","#E0B54F","#7A6BA8","#DD7877","#5C8A3A","#B0703C"];
const ST_C={closed:"var(--closed)",completed:"var(--done)",onTrack:"var(--good)",atRisk:"var(--warning)",delayed:"var(--critical)",onHold:"var(--neutral)"};
function donutSvg(segs,center,sub,size){size=size||150;const R=size*.37,r=size*.24,c=size/2,tot=segs.reduce((a,x)=>a+x.v,0)||1;let a0=-Math.PI/2,out="";
  for(const x of segs){if(!x.v)continue;const a1=a0+x.v/tot*2*Math.PI,lg=a1-a0>Math.PI?1:0,p=(a,rr)=>[c+rr*Math.cos(a),c+rr*Math.sin(a)];
    const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
    out+=x.v===tot?`<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${x.c}" stroke-width="${R-r}"><title>${esc(x.l)}: ${num(x.v)}</title></circle>`:`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${x.c}" data-tip="${esc(x.l)}: <b>${esc(x.fv||num(x.v))}</b> (${pct(x.v/tot*100)})"/>`;a0=a1}
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0">${out}<text x="${c}" y="${c+2}" text-anchor="middle" font-size="${Math.min(size*.15,size*.68/Math.max(3,String(center).replace(/<[^>]+>/g,"").length))}" font-weight="700" fill="var(--text)">${center}</text><text x="${c}" y="${c+size*.12}" text-anchor="middle" font-size="${Math.min(size*.075,size*.62/Math.max(6,String(sub||"").length))}" fill="var(--text-2)">${esc(sub||"")}</text></svg>`}
const lgdHtml=segs=>`<div class="lgd">${segs.filter(x=>x.v).map(x=>`<div><i style="background:${x.c}"></i><span>${esc(x.l)}</span><b class="num">${esc(x.fv||num(x.v))}</b></div>`).join("")}</div>`;
function gaugeSvg(a,b){const cx=100,cy=92,R=76,w=18,ang=v=>Math.PI*(1-Math.max(0,Math.min(100,v))/100),pt=v=>[cx+R*Math.cos(ang(v)),cy-R*Math.sin(ang(v))];
  const arc=(v,col)=>{if(v<=0)return "";const [x,y]=pt(v);return `<path d="M${cx-R} ${cy}A${R} ${R} 0 0 1 ${x} ${y}" fill="none" stroke="${col}" stroke-width="${w}"/>`};const an=ang(b);
  return `<svg viewBox="0 0 200 112" width="220" height="124" style="direction:ltr">${arc(100,"var(--track)")}${arc(a,"var(--s1)")}<line x1="${cx+(R-w/2-5)*Math.cos(an)}" y1="${cy-(R-w/2-5)*Math.sin(an)}" x2="${cx+(R+w/2+5)*Math.cos(an)}" y2="${cy-(R+w/2+5)*Math.sin(an)}" stroke="var(--s2)" stroke-width="3.5"/><text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="28" font-weight="700" fill="var(--text)">${pct(a)}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="11" fill="var(--text-2)">${esc(t("planned"))} ${pct(b)}</text></svg>`}
function hbarsHtml(rows,fmt,colorOf){const mx=Math.max(1,...rows.map(r=>Math.abs(r.v)));
  return `<div class="hbx">${rows.map((r,i)=>`<div class="hbx-r" data-tip="${esc(r.l)}: <b>${esc(fmt(r.v))}</b>"><div class="hbx-l">${esc(r.l)}</div><div class="hbx-t"><i style="width:${Math.abs(r.v)/mx*100}%;background:${colorOf(r,i)}"></i></div><div class="hbx-v num">${esc(fmt(r.v))}</div></div>`).join("")}</div>`}
function groupList(ps,by){const m=new Map();for(const p of ps){const k=EXEC_GROUPS[by](p)||"—";if(!m.has(k))m.set(k,[]);m.get(k).push(p)}return [...m.entries()].map(([k,l])=>({k,lab:tv(k)||k,g:grpStats(l)}))}
function execCharts(ps,g,by){
  const st=["closed","completed","onTrack","atRisk","delayed","onHold"].map(k=>({v:g[k],c:ST_C[k],l:t("st_"+k)}));

function crLeadOf(p){if(!p)return "";const a=(S.access||[]).find(x=>x.role==="lead"&&x.lead&&leadMatch(p,x.lead));return a?a.lead:""}

  if(S.role==="pmo"||S.role==="executive"||leadOK(p)||(S.dlgPm&&S.dlgPm.has(p.id)))return true;if(S.role==="lead")return leadMatch(p,S.leadName);if(S.role==="pm")return S.myProjects.has(p.id);return false})}
function crCanEdit(c){return !!c&&S.canWrite&&["draft","returned"].includes(c.status)&&canP(c.projectId)}

function crCode(f){const ty=crTypeRow(f.level,f.type),en=crEnt(f.ownerEntity),d=parseD(f.date);
  if(!ty||!en||!d||!String(f.initCode||"").trim())return "";
  const dd=String(d.getDate()).padStart(2,"0")+String(d.getMonth()+1).padStart(2,"0")+String(d.getFullYear()).slice(2);
  return `${ty[2]}.${String(f.initCode).trim().slice(0,2)}.${en[2]}.${dd}`}
function crUniqueCode(c){let base=crCode(c.f||{});if(!base)return "";let k=base,n=2;while((S.changes||[]).some(x=>x.id!==c.id&&x.code===k))k=base+"-"+(n++);return k}

  const pc=/^\d/.test(p.code||"")?"SD."+p.code:(p.code||"");
  return {date:isoToday(),requester:req,initCode:m?"SD."+m[1]:"",initName:m?m[2]:ini,ownerEntity:CR_MY_ENT,level:"مشروع",projCode:pc,projName:p.nameAr||p.name||"",projOwner:CR_MY_ENT,
    kpiCode:"",kpiName:"",kpiOwner:"",type:"",linked:"لا",linkedCodes:"",current:"",proposed:"",reasons:"",affected:"",
    impact:Object.fromEntries(CR_IMP.map(r=>[r[0],{on:"لا",d:""}]))}}
function crRequesters(c){const p=projById(c.projectId)||{};const L=[];const add=(v,lab)=>{v=String(v||"").trim();if(v&&!L.some(r=>r[0]===v))L.push([v,lab])};

async function crCreate(pid){const p=projById(pid);if(!p||!canP(pid))return;
  const c={id:uid("cr"),projectId:pid,status:"draft",code:"",f:crDefaults(p),npc:crBlankNpc(),createdBy:ME(),createdAt:nowIso(),history:[]};crHist(c,"create");
  try{await crSaveDoc(c)}catch(e){return}

  S.crOpen=c.id;S.crDraft=JSON.parse(JSON.stringify(c));S.crErr="";if(location.hash!=="#changes")location.hash="#changes";else render()}
function crValidate(c){const f=c.f||{},miss=[];const need=(k,lab)=>{if(!String(crGet(f,k)||"").trim())miss.push(lab)};
  need("date","1.2");need("requester","1.3");need("initCode","1.4");need("initName","1.5");need("ownerEntity","1.6");need("level","1.7");
  if(f.level==="مشروع"){need("projCode","1.7.1");need("projName","1.7.2");need("projOwner","1.7.3")}
  if(f.level==="مؤشر أداء"){need("kpiName","1.7.5");need("kpiOwner","1.7.6")}
  need("type","1.8");if(f.linked==="نعم")need("linkedCodes","1.10");
  need("current","2.2");need("proposed","2.3");need("reasons","2.4");
  for(const r of CR_IMP){if((f.impact||{})[r[0]]&&f.impact[r[0]].on==="نعم"&&!String(f.impact[r[0]].d||"").trim())miss.push(r[1])}
  if(!CR_IMP.some(r=>f.impact&&f.impact[r[0]]&&f.impact[r[0]].on==="نعم"))miss.push("3.2");
  const ks=crApplyKeys(c);if(ks)for(const k of ks){if(k==="name")continue;if(!String((c.ap||{})[k]??"").trim())miss.push(L2(CR_AF[k][0],CR_AF[k][1]))}
  if(ks&&c.f.type==="إضافة مشروع جديد"&&S.projects.some(p=>p.code===String((c.ap||{}).code||"").trim()))miss.push(t("crApCodeTaken"));
  return miss}
async function crSubmit(){const c=S.crDraft;if(!crCanEdit(c))return;const miss=crValidate(c);
  if(miss.length){S.crErr=t("crMissing",{f:miss.join("، ")});render();return}
  const go=async()=>{const p=projById(c.projectId);const lead=crLeadOf(p);
    c.code=c.code||crUniqueCode(c);c.status=lead?"lead":"pmo";c.submittedAt=nowIso();c.submittedBy=ME();c.approver=lead||"";delete c.returnNote;
    crHist(c,"submit");try{await crSaveDoc(c)}catch(e){return}S.crErr="";toast(t(lead?"crSentLead":"crSentPmo"));crShow(c)};
  if(!c.charter)confirmBox(t("crNoCharter"),t("crSubmitAnyway"),go);else await go()}
async function crSave(){const c=S.crDraft;if(!c)return;if(!crCanEdit(c)&&!crCanNpc(c))return;crHist(c,"save");
  if(crCanNpc(c)){const d=CR_DEC.find(x=>x[0]===(c.npc&&c.npc.approval&&c.npc.approval.decision));
    if(d&&c.status==="npc"){if(d[2]==="moreInfo"){c.status="returned";c.returnNote=t("crNpcMore")+(c.npc.approval.notes?": "+c.npc.approval.notes:"");crHist(c,"npc-more",c.npc.approval.notes)}else{c.status=d[2];crHist(c,"npc-"+d[2],c.npc.approval.notes);if(d[2]==="approved"){try{await crApply(c)}catch(e){toast(t("crApFail"),true)}}}}}
  try{await crSaveDoc(c)}catch(e){return}toast(t("saved"));crShow(c)}
async function crDecide(ok,note){const c=S.crDraft;if(!crCanDecide(c))return;const at=nowIso();
  if(ok){const was=c.status;c.status=was==="lead"?"pmo":"npc";c[was==="lead"?"leadApproved":"pmoApproved"]={by:ME(),at};crHist(c,was==="lead"?"lead-ok":"pmo-ok",note)}
  else{c.status="returned";c.returnNote=String(note||"").slice(0,1000);c.returnedBy=ME();c.returnedAt=at;crHist(c,"return",note)}
  try{await crSaveDoc(c)}catch(e){return}toast(t(ok?"apDoneOk":"apDoneRet"));crShow(c)}
function crReturnForm(){showModal(`<form id="frm" novalidate><div class="m-head"><div><h3>${esc(t("apReturn"))}</h3><div class="psub">${esc(t("apReturnSub"))}</div></div><button type="button" class="x" data-act="close-modal">✕</button></div>

function crDelete(){const c=S.crDraft;if(!c||c.status!=="draft"||!crCanEdit(c))return;

const CR_ATT=[["charter","ميثاق المشروع المحدّث","Updated project charter","يرجى إرفاق ميثاق المشروع المحدّث ليتمكن الفريق من تقييم الطلب بشكل كامل.","Attach the updated project charter so the request can be assessed in full."],["template","نموذج طلب التغيير المعبأ","Filled change request template","أرفق نموذج طلب التغيير (Excel) بعد تعبئته.","Attach the filled change request template (Excel)."]];
function crAtt(c,k){const a=(((c&&c.attachments)||{})[k]||[]).slice();if(k==="charter"&&c&&c.charter&&c.charter.assetId&&!a.some(x=>x.assetId===c.charter.assetId))a.unshift(c.charter);return a}
function crAttLinks(c){return CR_ATT.map(([k])=>crAtt(c,k)).flat().map(f=>`<a class="att-chip" href="/_blob/${esc(f.assetId)}" target="_blank" rel="noopener">${fileIco(f.type)} ${esc(f.name)}</a>`).join("")}
function crAttBlock(c,ed){return `<div class="cr-atts">${CR_ATT.map(([k,ar,en,dar,den])=>{const L=crAtt(c,k);const busy=S.crUp===k;
  return `<div class="cr-charter"><div><b>${esc(L2(ar,en))}</b><div class="psub">${esc(L2(dar,den))} ${esc(t("attTypes",{n:MAX_FILES}))}</div></div>
    <div class="cr-att-list">${L.length?L.map(f=>`<div class="ev-file"><span class="ev-ico">${fileIco(f.type)}</span><div style="min-width:0"><a href="/_blob/${esc(f.assetId)}" target="_blank" rel="noopener">${esc(f.name)}</a><div class="s">${fsize(+f.size||0)}</div></div>${ed?`<button class="x" type="button" data-act="cr-att-del" data-k="${k}" data-id="${esc(f.assetId)}" aria-label="${esc(t("evDelete"))}">✕</button>`:""}</div>`).join(""):`<span class="psub">${esc(t("crNoFile"))}</span>`}</div>
    ${ed&&L.length<MAX_FILES?`<label class="btn sm">${busy?esc(t("uploading")):"⤒ "+esc(t("attachUpTo",{n:MAX_FILES-L.length}))}<input type="file" class="cr-att-in" data-k="${k}" multiple accept="${ATT_ACCEPT}" hidden></label>`:""}</div>`}).join("")}</div>`}
async function crAttDel(k,assetId){const c=S.crDraft;if(!c||!crCanEdit(c))return;
  c.attachments={...(c.attachments||{})};c.attachments[k]=crAtt(c,k).filter(f=>f.assetId!==assetId);if(k==="charter"&&c.charter&&c.charter.assetId===assetId)delete c.charter;
  crHist(c,"attach");try{await crSaveDoc(c)}catch(e){return}if(assetsNS){try{await assetsNS.delete(assetId)}catch(e){}}render()}
async function crUploadMany(files,k){const c=S.crDraft;if(!c||!crCanEdit(c)||!files.length)return;if(!assetsNS){toast(t("evNoUpload"));return}
  const have=crAtt(c,k).length;if(have+files.length>MAX_FILES){toast(t("maxFiles",{n:MAX_FILES}),true);files=files.slice(0,Math.max(0,MAX_FILES-have));if(!files.length)return}
  S.crUp=k;render();let ok=0;const add=[];
  for(const file of files){const ext=(file.name.split(".").pop()||"").toLowerCase(),type=EV_TYPES[ext];if(!type){toast(t("evBadType",{f:file.name}),true);continue}
    if(file.size>20*1048576){toast(t("evTooBig",{f:file.name}),true);continue}
    try{let r;try{r=await assetsNS.upload(file,{type})}catch(e){if(e&&e.code==="store_unavailable"){await new Promise(z=>setTimeout(z,1200));r=await assetsNS.upload(file,{type})}else throw e}
      add.push({assetId:r.id,name:file.name,type:r.contentType||type,size:r.sizeBytes||file.size,at:nowIso(),by:ME()});ok++}
    catch(e){const q=e&&e.code;toast(q==="unsupported_type"?t("evBadType",{f:file.name}):q==="too_large"?t("evTooBig",{f:file.name}):t("saveFailed",{m:(e&&e.message)||q||"error"}),true)}}
  if(add.length){const cur=S.crDraft&&S.crDraft.id===c.id?S.crDraft:c;/* a live update may have refreshed the draft while uploading */cur.attachments={...(cur.attachments||{})};cur.attachments[k]=[...crAtt(cur,k),...add];if(k==="charter")delete cur.charter;crHist(cur,"attach");try{await crSaveDoc(cur)}catch(e){}}
  S.crUp=false;if(ok)toast(t("uploaded",{n:num(ok)}));render()}
async function crUpload(file){const c=S.crDraft;if(!c||!crCanEdit(c)||!file)return;if(!assetsNS){toast(t("evNoUpload"));return}
  const ext=(file.name.split(".").pop()||"").toLowerCase(),type=EV_TYPES[ext];if(!type){toast(t("evBadType",{f:file.name}),true);return}
  if(file.size>20*1048576){toast(t("evTooBig",{f:file.name}),true);return}
  S.crUp=true;render();
  try{let r;try{r=await assetsNS.upload(file,{type})}catch(e){if(e&&e.code==="store_unavailable"){await new Promise(z=>setTimeout(z,1200));r=await assetsNS.upload(file,{type})}else throw e}
    const old=c.charter;c.charter={assetId:r.id,name:file.name,type:r.contentType||type,size:r.sizeBytes||file.size,at:nowIso(),by:ME()};crHist(c,"charter");await crSaveDoc(c);

  catch(e){const k=e&&e.code;toast(k==="unsupported_type"?t("evBadType",{f:file.name}):k==="too_large"?t("evTooBig",{f:file.name}):t("saveFailed",{m:(e&&e.message)||k||"error"}),true)}
  finally{S.crUp=false;render()}}

const crApplyKeys=c=>c&&c.f&&c.f.level==="مشروع"?CR_APPLY[c.f.type]:undefined;
function crApPrefill(c){const ks=crApplyKeys(c);const p=projById(c.projectId);c.ap={};if(!ks||!p)return;

const crFmtV=(k,v)=>v===""||v==null?"—":k==="budget"?num(+v||0):(k==="start"||k==="end")?fdate(v):String(v);

const nmNorm=s=>normTxt(String(s||"").trim()).replace(/^(الدكتوره|الدكتور|د\\|د\.|د |ا\.|ا )\s*/,"").replace(/\bال\s+/g,"ال").replace(/عبد ال/g,"عبدال").replace(/\s+/g," ").trim();
function nameMatch(a,b){const A=nmNorm(a).split(" "),B=nmNorm(b).split(" ");if(!A[0]||!B[0])return false;if(A.join(" ")===B.join(" "))return true;return A[0]===B[0]&&A[A.length-1]===B[B.length-1]}
function pmDirectory(){const m=new Map();for(const p of S.projects){if(!p.manager)continue;let k=[...m.keys()].find(x=>nameMatch(x,p.manager));if(!k){k=p.manager;m.set(k,[])}m.get(k).push(p)}
  return [...m.entries()].map(([name,ps])=>{const dEm=(S.directory||[]).find(d=>nameMatch(d.name,name));const email=dEm?[dEm.name,dEm.email]:(S.roster&&S.roster.emails?Object.entries(S.roster.emails).find(([n])=>nameMatch(n,name)):null);
    const ids=ps.map(p=>p.id);const linked=S.roles.some(r=>r.role==="pm"&&ids.every(id=>(r.projects||[]).includes(id)));
    return{name,email:email?email[1]:"",projects:ps.sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true})),linked}}).sort((a,b)=>a.linked-b.linked||a.name.localeCompare(b.name))}

const normTxt=s=>String(s||"").toLowerCase().replace(/[ً-ْـ​-‏‪-‮]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي");
function stem(w){
  if(/[؀-ۿ]/.test(w)){if(w.length>5&&/^(وال|بال|كال|فال)/.test(w))w=w.slice(3);else if(w.length>4&&/^لل/.test(w))w=w.slice(2);else if(w.length>4&&/^ال/.test(w))w=w.slice(2);else if(w.length>4&&/^و/.test(w)&&!/^(وطن|وضع|وزار|ورش|وعي|وقا)/.test(w))w=w.slice(1);
    if(w.length>5&&/(ات|ين|ون|يه)$/.test(w))w=w.slice(0,-2);else if(w.length>4&&/[هي]$/.test(w))w=w.slice(0,-1);return w}
  if(w.length>5&&w.endsWith("ies"))return w.slice(0,-3)+"y";if(w.length>5&&w.endsWith("ing"))return w.slice(0,-3);if(w.length>4&&w.endsWith("ed"))return w.slice(0,-2);if(w.length>4&&w.endsWith("es"))return w.slice(0,-2);if(w.length>3&&w.endsWith("s")&&!w.endsWith("ss"))return w.slice(0,-1);return w}

function projEntries(p){

function tokScore(q,tk){let best=0;for(const w of tk){if(w===q)return 1;if(q.length>=2&&w.startsWith(q))best=Math.max(best,.85);else if(w.length>=4&&q.startsWith(w))best=Math.max(best,.7);else if(q.length>=5&&lev1(q,w))best=Math.max(best,.6)}return best}
function smartSearch(q,list){
  const raw=normTxt(q).trim();if(!raw)return list.map(p=>({p,score:1}));
  const qt=toks(q);if(!qt.length)return[];
  const out=[];
  for(const p of list){const E=projEntries(p);let total=0,matched=0,hit=null,hitW=0;
    for(const t0 of qt){const alts=SYN.get(t0)||[t0];let best=0,bestE=null;
      for(const e of E){let s=0;for(const a of alts){const v=tokScore(a,e.tk)*(a===t0?1:.8);if(v>s)s=v}if(s>0){const v=s*e.w;if(v>best){best=v;bestE=e}}}
      if(best>0){matched++;total+=best;if(best>hitW&&bestE){hitW=best;hit=bestE}}}
    if(/^\d+(\.\d+)*$/.test(raw)&&String(p.code||"").startsWith(raw)){total+=20;hit={f:"code",text:p.code};matched=qt.length}

  return out.filter(x=>!anyAll||x.all||x.score>=4).sort((a,b)=>b.score-a.score);
}

    case"load-sample":el.disabled=true;await loadSample();break;
    case"clear-all":confirmBox(t("confirmClear"),t("dClear"),clearAll);break;
    case"import-commit":el.disabled=true;await commitImport();break;
    case"import-discard":S.imp=null;render();break;
    case"export-xlsx":exportXlsx(false);break;
    case"template":exportXlsx(true);break;
    case"export-csv":saveFile(`pmo-projects-${isoToday()}.csv`,toCSV(exportRows().P));break;
    case"copy-csv":try{await navigator.clipboard.writeText(toCSV(exportRows().P).replace(/^﻿/,""));toast(t("dCopied"))}catch(err){toast("Clipboard unavailable")}break;
  }
});
$("#overlay").addEventListener("click",closeDrawer);
document.addEventListener("submit",e=>{if(e.target&&e.target.id==="govForm"){e.preventDefault();saveGov(e.target);return}if(e.target&&e.target.id==="tplForm"){e.preventDefault();saveTpl(e.target)}if(e.target&&e.target.id==="loginForm"){e.preventDefault();doLogin(e.target)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("open"))closeModal();else if(S.drawer)closeDrawer()}});
document.addEventListener("input",e=>{const x=e.target;if(x.classList&&x.classList.contains("tpl-in")){const ty=x.dataset.ty,f=x.form;const s=PH_LIST.reduce((a,k)=>a+(+f.elements[ty+"."+k].value||0),0);const c=f.querySelector(`.tpl-sum[data-ty="${ty}"]`);if(c){c.textContent=num(s);c.style.color=s===100?"":"var(--critical)"}return}if(x.classList&&x.classList.contains("pr-range")){const n=x.parentNode.querySelector(".pr-num");if(n)n.value=x.value}});
document.addEventListener("focusout",e=>{if(S.drawerDirty&&e.target.matches&&e.target.matches("input.pr-num"))setTimeout(()=>{if(S.drawerDirty)renderDrawer()},0)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches&&e.target.matches("input.pr-num")){e.target.blur()}});
document.addEventListener("change",e=>{const x=e.target;if(x.classList&&x.classList.contains("wp-ph")){setWpPhase(x.dataset.pid,x.dataset.wp,x.value);return}if(x.id==="dlgKind"){dlgFormRefresh();return}if(x.id==="wType"){setProjType(x.dataset.pid,x.value);return}if(x.id==="updOff"){S.updOfficer=x.value;render();return}if(x.classList&&(x.classList.contains("pr-range")||x.classList.contains("pr-num"))){let v=+x.value;if(isNaN(v))v=0;setActPr(x.dataset.pid,x.dataset.aid,v);return}
  if(x.classList&&x.classList.contains("ev-input")&&x.files&&x.files.length){uploadEvidence(x.dataset.pid,x.dataset.aid,[...x.files]);x.value="";return}
  if(e.target.id==="fileIn"&&e.target.files[0])analyzeFile(e.target.files[0]);if(e.target.id==="rmMissing"&&S.imp){S.imp.removeMissing=e.target.checked}});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)analyzeFile(f)}});
let qT;$("#fq").addEventListener("input",e=>{renderSuggest();clearTimeout(qT);qT=setTimeout(()=>{S.filters.q=e.target.value;render()},300)});
$("#fq").addEventListener("focus",()=>{if($("#fq").value.trim())renderSuggest()});
$("#fq").addEventListener("keydown",e=>{const box=$("#sugg");if(e.key==="ArrowDown"){e.preventDefault();if(box.hidden)renderSuggest();sgMove(1)}else if(e.key==="ArrowUp"){e.preventDefault();sgMove(-1)}else if(e.key==="Escape"){box.hidden=true}else if(e.key==="Enter"){if(sgI>=0&&sgList[sgI]){e.preventDefault();box.hidden=true;openDrawer(sgList[sgI].p.id)}else{box.hidden=true;clearTimeout(qT);S.filters.q=$("#fq").value;render()}}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".search"))$("#sugg").hidden=true;if(!e.target.closest(".usearch")){const u=$("#userHits");if(u)u.innerHTML=""}});
let uT;document.addEventListener("input",e=>{if(e.target.id==="userQ"){clearTimeout(uT);uT=setTimeout(()=>userSearch(e.target.value.trim()),200)}});

$("#fLead").addEventListener("change",e=>{S.filters.lead=e.target.value;render()});
$("#fInit").addEventListener("change",e=>{S.filters.init=e.target.value;render()});
$("#fStatus").addEventListener("change",e=>{S.filters.status=e.target.value;render()});
$("#fReset").addEventListener("click",()=>{$("#sugg").hidden=true;S.filters={q:"",portfolio:"",init:"",dept:"",status:"",lead:""};$("#fq").value="";render()});

$("#bellBtn").addEventListener("click",()=>{S.apFilter=S.role==="pm"?"returned":"pending";if(location.hash==="#approvals")render();else location.hash="#approvals"});

$("#themeBtn").addEventListener("click",()=>{S.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";store.set("theme",S.theme);render()});

const VIEWS=["home","overview","exec","kpis","projects","workplan","updates","approvals","changes","risks","timeline","data","users"];
function route(){const h=location.hash.replace("#","");if(h!=="changes"&&S.view==="changes"){S.crOpen=null;S.crDraft=null}S.view=VIEWS.includes(h)?h:"overview";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
/* tooltip */
const tip=$("#tip");
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(!el){tip.classList.remove("on");return}
  tip.innerHTML=el.dataset.tip;tip.classList.add("on");const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("pointerleave",()=>tip.classList.remove("on"));
let toT;function toast(m,sticky){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(toT);toT=setTimeout(()=>el.classList.remove("on"),sticky?6000:2600)}

route();
init();
checkBundle();
loadRoster();
loadKpis();
