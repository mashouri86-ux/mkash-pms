name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: .NET build and business-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore MKAsh.sln
      - run: dotnet build MKAsh.sln --no-restore -c Release
      - run: dotnet test MKAsh.sln --no-build -c Release --logger "console;verbosity=normal"

  web:
    name: Web app type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
