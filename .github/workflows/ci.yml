name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: .NET build and business-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore MKAsh.sln
      - run: dotnet build MKAsh.sln --no-restore -c Release
      - run: dotnet test MKAsh.sln --no-build -c Release --logger "console;verbosity=normal"

  web:
    name: Web app type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  smoke:
    name: API end-to-end check on SQL Server
    runs-on: ubuntu-latest
    needs: api
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Start the API (Development mode, demo users, seeded data)
        working-directory: src/MKAsh.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet build -c Release
          nohup dotnet run -c Release --no-build --no-launch-profile > ../../api.log 2>&1 &
      - name: Run checks
        run: scripts/smoke.sh
      - name: API log
        if: always()
        run: tail -n 200 api.log
