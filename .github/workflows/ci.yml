name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: .NET build and business-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore MKAsh.sln
      - run: dotnet build MKAsh.sln --no-restore -c Release
      - run: dotnet test MKAsh.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: Release package contains the server and all screens
        run: |
          dotnet publish src/MKAsh.Api -c Release -o out
          test -f out/MKAsh.Api.dll
          test -f out/wwwroot/index.html
          test -f out/wwwroot/system/claude-shim.js
          test -f out/wwwroot/data/brand/tamkeen-logo.png
          echo "Release package OK: $(du -sh out | cut -f1)"

  web:
    name: Dashboard screens and data layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Data layer script is valid
        run: node --check web/system/claude-shim.js
      - name: Dashboard loads the data layer and its data files exist
        run: |
          grep -q 'src="system/claude-shim.js"' web/index.html
          for f in data/kpis.json data/seed.json data/pm-roster.json data/cr-template.b64.txt data/map/page-1.jpg data/fonts/inter-Regular.woff; do test -f "web/$f"; done
      - name: Dashboard script compiles
        run: |
          python3 - <<'PY'
          import re
          s=open('web/index.html',encoding='utf-8').read()
          m=[x for x in re.findall(r'<script>(.*?)</script>', s, re.S)]
          open('/tmp/app.js','w',encoding='utf-8').write(m[-1])
          PY
          node --check /tmp/app.js

  smoke:
    name: API end-to-end check on SQL Server
    runs-on: ubuntu-latest
    needs: api
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Start the API (Development mode, demo users, seeded data)
        working-directory: src/MKAsh.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5173
        run: |
          dotnet build -c Release
          nohup dotnet run -c Release --no-build --no-launch-profile > ../../api.log 2>&1 &
      - name: Run checks
        run: scripts/smoke.sh
      - name: Start the API again on SQLite (the Codespaces test set-up)
        working-directory: src/MKAsh.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5181
          Database__Provider: Sqlite
          ConnectionStrings__Pms: "Data Source=/tmp/ci-sqlite.db"
        run: nohup dotnet run -c Release --no-build --no-launch-profile > ../../api-sqlite.log 2>&1 &
      - name: Run checks on SQLite
        env:
          BASE: http://localhost:5181
        run: scripts/smoke.sh
      - name: API logs
        if: always()
        run: tail -n 100 api.log; echo ---- sqlite; tail -n 100 api-sqlite.log

  browser:
    name: Full system test in a browser (data transfer and workflows)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Start Tamkeen (test mode, SQLite)
        working-directory: src/MKAsh.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5173
          Database__Provider: Sqlite
          ConnectionStrings__Pms: "Data Source=/tmp/e2e.db"
        run: |
          dotnet build -c Release
          nohup dotnet run -c Release --no-build --no-launch-profile > ../../e2e-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/health && break; sleep 2; done
      - name: Run the full system test
        run: |
          python tests/e2e/make_test_data.py /tmp/test-migration.json
          python tests/e2e/full_system_test.py --base http://localhost:5173 --data /tmp/test-migration.json \
            --pm pm@example.org --lead lead@example.org --pmo pmo@example.org --shots e2e-screens
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e-screens
      - name: Server log
        if: always()
        run: tail -n 80 e2e-api.log
